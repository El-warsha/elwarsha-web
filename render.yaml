services:
  - type: web
    name: elwarsha-web
    runtime: static
    buildCommand: yarn install --immutable && yarn build
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /ar
        destination: /ar/
      - type: redirect
        source: /en
        destination: /en/
      - type: redirect
        source: /ar/initiative
        destination: /ar/initiative/
      - type: redirect
        source: /en/initiative
        destination: /en/initiative/
      - type: redirect
        source: /ar/roadmap
        destination: /ar/roadmap/
      - type: redirect
        source: /en/roadmap
        destination: /en/roadmap/
      - type: redirect
        source: /ar/participation
        destination: /ar/participation/
      - type: redirect
        source: /en/participation
        destination: /en/participation/
      - type: redirect
        source: /ar/faq
        destination: /ar/faq/
      - type: redirect
        source: /en/faq
        destination: /en/faq/
      - type: rewrite
        source: /ar/
        destination: /ar/index.html
      - type: rewrite
        source: /en/
        destination: /en/index.html
      - type: rewrite
        source: /ar/initiative/
        destination: /ar/initiative/index.html
      - type: rewrite
        source: /en/initiative/
        destination: /en/initiative/index.html
      - type: rewrite
        source: /ar/roadmap/
        destination: /ar/roadmap/index.html
      - type: rewrite
        source: /en/roadmap/
        destination: /en/roadmap/index.html
      - type: rewrite
        source: /ar/participation/
        destination: /ar/participation/index.html
      - type: rewrite
        source: /en/participation/
        destination: /en/participation/index.html
      - type: rewrite
        source: /ar/faq/
        destination: /ar/faq/index.html
      - type: rewrite
        source: /en/faq/
        destination: /en/faq/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
